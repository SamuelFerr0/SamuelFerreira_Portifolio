spring.application.name=portfolio
server.port=${PORT:8080}

app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

github.username=${GITHUB_USERNAME:SamuelFerr0}
github.token=${GITHUB_TOKEN:}
github.hidden-repos=${GITHUB_HIDDEN_REPOS:}

wakatime.oauth.access-token=${WAKATIME_ACCESS_TOKEN:}
wakatime.oauth.refresh-token=${WAKATIME_REFRESH_TOKEN:}
wakatime.oauth.app-id=${WAKATIME_APP_ID:}
wakatime.oauth.app-secret=${WAKATIME_APP_SECRET:}
wakatime.oauth.redirect-uri=${WAKATIME_REDIRECT_URI:http://localhost:8787/callback}
wakatime.oauth.token-url=https://wakatime.com/oauth/token

wakatime.timezone=${WAKATIME_TIMEZONE:America/Sao_Paulo}
wakatime.default-range=${WAKATIME_DEFAULT_RANGE:all_time}
wakatime.max-languages=8
wakatime.hidden-languages=${WAKATIME_HIDDEN_LANGUAGES:}
wakatime.profile-url=${WAKATIME_PROFILE_URL:}
wakatime.show-projects=false

wakatime.ativo-minutos=10
wakatime.pausa-minutos=15
wakatime.coding-now.refresh-seconds=60
wakatime.coding-now.public-projects=${WAKATIME_PROJETOS_PUBLICOS:portfolio-santos}
wakatime.coding-now.show-private=false

ask.api-url=${ASK_API_URL:https://generativelanguage.googleapis.com/v1beta/openai}
ask.model=${ASK_MODEL:gemini-3.5-flash-lite}
ask.api-key=${ASK_API_KEY:${GEMINI_API_KEY:}}
ask.max-tokens=1200
ask.reasoning-effort=${ASK_REASONING_EFFORT:low}
ask.timeout-seconds=30
ask.max-question=500
ask.limit.per-minute=6
ask.limit.per-day=60
ask.course-start=2026-02
ask.timezone=${ASK_TIMEZONE:America/Sao_Paulo}

spring.mvc.async.request-timeout=90s

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=10m

spring.datasource.url=${DB_URL:jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
