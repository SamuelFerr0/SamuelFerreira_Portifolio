spring.application.name=portfolio
server.port=${PORT:8080}

app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

github.username=${GITHUB_USERNAME:SamuelFerr0}
github.token=${GITHUB_TOKEN:}
github.hidden-repos=${GITHUB_HIDDEN_REPOS:}

wakatime.api-key=${WAKATIME_API_KEY:}
wakatime.timezone=${WAKATIME_TIMEZONE:America/Sao_Paulo}
wakatime.ativo-minutos=10
wakatime.pausa-minutos=15
wakatime.projetos-publicos=${WAKATIME_PROJETOS_PUBLICOS:portfolio-santos}

ask.api-url=${ASK_API_URL:https://generativelanguage.googleapis.com/v1beta/openai}
ask.model=${ASK_MODEL:gemini-3.5-flash-lite}
ask.api-key=${ASK_API_KEY:${GEMINI_API_KEY:}}

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=10m

spring.datasource.url=${DB_URL:jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
